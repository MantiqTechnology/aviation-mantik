components:
  securitySchemes:
    demoSession:
      type: apiKey
      in: cookie
      name: ama_demo_session
  parameters:
    FlightId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    Payload:
      description: P0 write DTO placeholder; resolve from shared contracts and active Nuxt consumer in stage A.
      type: object
      additionalProperties: true
    Approval:
      type: object
      required: [expectedVersion, readinessRevision, note]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        readinessRevision: { type: integer, minimum: 1 }
        note: { type: string, minLength: 3, maxLength: 1000 }
    Lifecycle:
      type: object
      required: [expectedVersion, idempotencyKey]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, minLength: 12, maxLength: 200 }
        note: { type: string, maxLength: 500 }
    Concurrency:
      type: object
      required: [expectedUpdatedAt]
      properties:
        expectedUpdatedAt: { type: string, format: date-time }
        note: { type: string, maxLength: 500 }
    ActualTime:
      type: object
      required: [actualAt]
      properties:
        actualAt: { type: string, format: date-time }
        stationId: { type: string }
        note: { type: string, maxLength: 1000 }
        expectedVersion: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
    ExpectedVersion:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    StationCompletion:
      type: object
      required: [expectedVersion, completionRecord, evidenceReference]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        completionRecord: { type: string, minLength: 5, maxLength: 1000 }
        evidenceReference: { type: string, minLength: 3, maxLength: 500 }
    FuelAction:
      type: object
      required: [expectedVersion, idempotencyKey]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
        approvedQuantityLitre: { type: number, exclusiveMinimum: 0 }
        actualUpliftLitre: { type: number, exclusiveMinimum: 0 }
        actualPricePerLitre: { type: number, minimum: 0 }
    Login:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 128 }
    Envelope:
      type: object
      required: [ok, meta]
      properties:
        ok: { type: boolean }
        data:
          description: Replace with consumer-audited P0 DTO at stage A.
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
        meta:
          type: object
          required: [requestId, demoMode]
          properties:
            requestId: { type: string }
            demoMode: { type: boolean }
            count: { type: integer, minimum: 0 }
  responses:
    Success:
      description: Request succeeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Failure:
      description: Request rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
